# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-hook-webrequest-plugin"
version = "1.6.0"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "First-party signed kind:hook plugin cdylib: the webrequest forwarder (module: webrequest), packaged as a droppable busbar plugin. Drop the signed tarball into plugins/ and name it from a hook's module: webrequest."
license.workspace = true

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`). rlib: REQUIRED for `cargo test` to
# emit the cdylib artifact the conformance test loads (a cdylib-only package builds a trivial test
# harness and never produces the .so/.dylib).
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-hook-webrequest-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[lints]
workspace = true

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports.
busbar-hook-webrequest = { path = "../hook-webrequest" }
# `export_door!`, the macro that emits the image's one symbol. Same pinned rev as the logic crate's.
busbar-contract = { workspace = true }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-hook-webrequest-plugin = { path = ".", features = ["dropped-in"] }
# The conformance test loads the built cdylib over the REAL loader and the linked door through the
# same loader — dev-only, never in the shipped artifact. Same pinned rev as busbar-contract above,
# so one busbar source resolves.
busbar-plugin-loader = { workspace = true }
busbar-test-kit = { workspace = true }
# THE SUITE'S HOST CONNECTOR (tests/support/conformance_host.rs, rendered): busbar's connector, its
# TLS test kit, and the transport framers this plugin's needs name. Dev-only.
busbar-core-connector = { workspace = true }
busbar-transport-tcp = { workspace = true }
busbar-transport-http = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }
