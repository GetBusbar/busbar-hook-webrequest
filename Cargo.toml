#
# One repo per plugin (owner ruling, busbar 1.6.0): the webrequest hook's logic (busbar-hook-webrequest,
# the rlib busbar's composition root links, with its door) and the thin cdylib that packages it
# (busbar-hook-webrequest-plugin), as a same-repo Cargo workspace laid out like export-file.
[workspace]
resolver = "2"
members = [
    "hook-webrequest",
    "hook-webrequest-plugin",
]
