# RENDERED by `busbar-release plugin sync busbar-hook-webrequest` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "6 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@8fc3b1b2a6d123575a77ce505e501b595fb24cef
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-hook-webrequest
      plugin_name: busbar-hook-webrequest
      plugin_alias: webrequest
      plugin_kind: hook
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
