# webrequest-hook CI — build, test, the forwarder's linked + dropped-in conformance, and the real
# admin-API install against a real busbar, all against the busbar rev this repo PINS.
#
# This repo builds standalone: its only busbar dependency (busbar-contract, and busbar-plugin-loader
# dev-only for the conformance and e2e tests) is a `git` dependency on
# https://github.com/GetBusbar/busbar at the rev in field 1 of `.busbar-ref`. No path dependency into
# a busbar checkout. The one busbar CHECKOUT here is for `tests/full_stack_e2e.rs`, which builds and
# boots the real `busbar` binary — checked out beside this repo at that same pinned rev, so the
# binary under test is the one the manifests name.
#
# The moving leg (this repo against busbar's `predev`) is busbar's side of the contract: its ci.yml
# builds this repo against its own tree.
name: ci

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch: {}
  # release.yml's `gate` runs THIS workflow on the tagged commit, so a release is gated by exactly the
  # suite (pin check, fmt, clippy, build, test, conformance, full-stack e2e) every dev push runs — at
  # the same pin.
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pin:
    name: the busbar pin is one rev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every `rev = "..."` on the busbar git source is field 1 of `.busbar-ref`. Two revs would link
      # two copies of the contract; a rev that disagrees with `.busbar-ref` makes the pin a lie about
      # what the release builds against.
      - name: every busbar git dependency names the .busbar-ref rev
        run: |
          set -euo pipefail
          pin=$(awk '{print $1; exit}' .busbar-ref)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.busbar-ref field 1 is not a full sha: '$pin'"; exit 1; }
          found=$(grep -hoE 'git = "https://github.com/GetBusbar/busbar", rev = "[0-9a-f]+"' Cargo.toml | grep -oE '[0-9a-f]{40}' | sort -u)
          [ -n "$found" ] || { echo "::error::no busbar git dependency found"; exit 1; }
          if [ "$found" != "$pin" ]; then
            echo "::error::busbar revs in Cargo.toml ($found) != .busbar-ref ($pin)"; exit 1
          fi
          if grep -nE 'path = "\.\./' Cargo.toml; then
            echo "::error::Cargo.toml names a sibling-checkout path dependency"; exit 1
          fi
          lock=$(grep -oE 'git\+https://github.com/GetBusbar/busbar\?rev=[0-9a-f]+#[0-9a-f]+' Cargo.lock | sed 's/.*#//' | sort -u)
          if [ "$lock" != "$pin" ]; then
            echo "::error::Cargo.lock resolves busbar at ($lock), not .busbar-ref ($pin)"; exit 1
          fi
          echo "pinned busbar rev: $pin"

  build-test:
    name: fmt, clippy, build, test, conformance, full-stack e2e [${{ matrix.os }}]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: Resolve the pinned busbar rev (field 1 of .busbar-ref)
        id: pin
        run: echo "rev=$(awk '{print $1; exit}' plugin/.busbar-ref)" >> "$GITHUB_OUTPUT"
      # tests/full_stack_e2e.rs builds and boots the real busbar binary from `../busbar`.
      - name: Checkout busbar at the pinned rev (the real binary full_stack_e2e boots)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.pin.outputs.rev }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin
            busbar
          key: busbar-${{ steps.pin.outputs.rev }}
      - name: fmt
        working-directory: plugin
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: plugin
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build (the rlib a busbar build links, and the cdylib a signed tarball carries)
        working-directory: plugin
        run: cargo build --locked
      - name: test (unit + net_guard, loader-seam e2e, linked/dropped-in conformance, full-stack e2e)
        working-directory: plugin
        run: cargo test --locked

  # ── coverage: INFORMATIONAL only. An additive, non-required observation job that uploads an lcov
  #    report to Codecov for the README badge. Never a gate: Codecov's statuses are
  #    `informational: true` (codecov.yml) and the upload uses `fail_ci_if_error: false`.
  coverage:
    name: coverage (llvm-cov · codecov)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/qa"]'), github.ref)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: Resolve the pinned busbar rev (field 1 of .busbar-ref)
        id: pin
        run: echo "rev=$(awk '{print $1; exit}' plugin/.busbar-ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout busbar at the pinned rev (the real binary full_stack_e2e boots)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.pin.outputs.rev }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin
            busbar
          key: coverage-${{ steps.pin.outputs.rev }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        working-directory: plugin
        run: cargo llvm-cov --locked --ignore-run-fail --lcov --output-path lcov.info
      - name: Upload to Codecov (never fails the build)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: plugin/lcov.info
          slug: GetBusbar/busbar-hook-webrequest
          fail_ci_if_error: false
