# RENDERED by `busbar-release plugin sync busbar-hook-webrequest` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. THIS REPO TESTS ITSELF AGAINST BUSBAR with the fleet's ONE
# harness: busbar's reusable plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref), so
# the CI logic, the gates (busbar scripts/fleet/plugin-gates.py), the dependency policy
# (.github/fleet/deps.toml) and the contract move together (OWNER 2026-10-02). No CI logic lives here.
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}
  # release.yml runs this file on the tagged commit before it publishes.
  workflow_call: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@4d473bbe8ca44b4af69606f18bf7da1ac8d0353a
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
      plugin_crate: busbar-hook-webrequest-plugin
      plugin_kind: hook
      plugin_alias: webrequest
    secrets: inherit
