# RENDERED by `busbar-release plugin heal busbar-hook-webrequest` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@7356bbfb6baeb0e9245a59dc74f8b4bfadb2c5a4
    with:
      plugin_crate: busbar-hook-webrequest-plugin
      manifest_name: busbar-hook-webrequest
      plugin_alias: webrequest
      plugin_kind: hook
      asset_prefix: busbar-hook-webrequest
      description: "A transparent HTTP forwarder that POSTs each hook op envelope (decide/transform/notify/configure/describe/status) to an operator-configured URL and returns the capped JSON reply: a busbar first-party kind:hook plugin (dlopen cdylib)."
      lib_only: false
      needs_prompt: "rw"
      needs_user: "ro"
      declares_file: "declares.json"
      former_names: "busbar-webrequest"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@7356bbfb6baeb0e9245a59dc74f8b4bfadb2c5a4
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-hook-webrequest
      plugin_name: busbar-hook-webrequest
      plugin_alias: webrequest
      plugin_kind: hook
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
